<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(124,92,255,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo -->
  <text x="80" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#e8e8ed">Skills<tspan fill="#7c5cff">Forge</tspan></text>
  <!-- Badge -->
  <rect x="80" y="140" width="200" height="32" rx="16" fill="rgba(61,220,151,0.12)" stroke="rgba(61,220,151,0.25)" stroke-width="1"/>
  <text x="180" y="162" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3ddc97" text-anchor="middle">SEO/GEO Pack v1.0</text>
  <!-- H1 -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#e8e8ed" letter-spacing="-2">Ship SEO audits</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#7c5cff" letter-spacing="-2">10x faster</text>
  <!-- Sub -->
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="24" fill="#8888a0">11 production-grade skills for Claude Code · $49 lifetime</text>
  <!-- Skill pills -->
  <rect x="80" y="490" width="160" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="160" y="514" font-family="system-ui, sans-serif" font-size="13" fill="#8888a0" text-anchor="middle">Technical Audit</text>
  <rect x="256" y="490" width="160" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="336" y="514" font-family="system-ui, sans-serif" font-size="13" fill="#8888a0" text-anchor="middle">GEO Optimizer</text>
  <rect x="432" y="490" width="160" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="512" y="514" font-family="system-ui, sans-serif" font-size="13" fill="#8888a0" text-anchor="middle">Schema Markup</text>
  <rect x="608" y="490" width="160" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="688" y="514" font-family="system-ui, sans-serif" font-size="13" fill="#8888a0" text-anchor="middle">+ 8 more</text>
  <!-- URL -->
  <text x="1120" y="600" font-family="system-ui, sans-serif" font-size="18" fill="#555568" text-anchor="end">skillsforge.dev</text>
</svg>
